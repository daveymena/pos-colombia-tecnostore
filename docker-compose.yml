services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-posdb}
    ports: ["5432:5432"]
    volumes: ["pos_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-posdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:-pos_dev_password}@db:5432/${POSTGRES_DB:-posdb}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env antes de ejecutar}
      PORT: 3000
      NODE_ENV: production
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:3000/api
    ports: ["5173:80"]
    depends_on: ["api"]
    restart: unless-stopped
volumes:
  pos_pgdata:
